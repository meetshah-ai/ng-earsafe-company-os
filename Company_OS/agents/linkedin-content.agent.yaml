# NG EarSafe — LinkedIn Content Agent (Managed Agent, version-controlled)
#
# LIVE AGENT ID: agent_0119BswBnem6JbKHfJ8iihtv   (created 2026-07-13, version 1, Sonnet 5)
# ENVIRONMENT:   env_01XyAqVA96XbV6YDd2YpeyPB  (ng-eaarsafe)
# VAULT:         vlt_011Cct4FFqcsnrcEDFfzHCXo  (ng-earsafe-readonly — GitHub + Windsor creds)
#
# Edit this file, then push the change live with:
#   ant beta:agents update --agent-id agent_0119BswBnem6JbKHfJ8iihtv --version <current> < <this file>
# (Every update creates a new version. Nothing is ever overwritten.)
#
# Canonical process: Company_OS/departments/linkedin-content/cycle_flow_v3.md
# Delivery: commits the cycle brief to Company_OS/linkedin/<cycle_id>.md on main;
#           .github/workflows/email-linkedin.yml turns that commit into Meet's email.
