# ── TOKEN DISCIPLINE — read this before changing anything ─────────────────────
# The rules (ROAS definition, thresholds, ratchet, gates, stop list) are COMPILED INTO the system
# prompt below. The agent does NOT read the constitution at runtime — a rule that never changes
