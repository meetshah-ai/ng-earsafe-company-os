  | Organic clicks / month | ~1,963 | 2,600 | 3,500 | 5,000 |
  | Blog page CVR | ~0% | 0.5% | 1.0% | 1.5% |
  | "open ear headphones" position | 12.0 | 9.0 | 7.0 | 5.0 |
