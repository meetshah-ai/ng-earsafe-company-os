#
# LIVE AGENT ID: <fill after `ant beta:agents create`>      (Sonnet 5)
# DEPLOYMENT:    <fill after `ant beta:deployments create`>  (SEO/AEO Operator — 0 8 * * 1 Asia/Kolkata)
# ENVIRONMENT:   env_01XyAqVA96XbV6YDd2YpeyPB   (ng-eaarsafe)              ← shared across agents
# VAULT:         vlt_011Cct4FFqcsnrcEDFfzHCXo   (ng-earsafe-readonly — GitHub + Windsor creds)
#
# Runs every MONDAY 08:00 IST — after the Daily D2C Report (07:00) and the Google Ads Operator
# (07:30), so the week's numbers are settled. Weekly cadence matches SEO's natural clock: the Q3
