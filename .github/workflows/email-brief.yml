name: Email the Daily D2C Report

# Fires when the Daily D2C Report agent (Company_OS/agents/daily-brief.agent.yaml) commits its
# brief. Emails Meet + Riya from Meet's Gmail over authenticated SMTP. Information only — no
# approvals, no links to act on. The agent commits Company_OS/briefs/<D>.md; GitHub mails it.
#
# The brief is mostly tables, which turn to pipe-soup as plain text, so it is rendered to HTML by
# .github/scripts/render_daily_brief_email.py. Everything below the
# "<!-- APPENDIX — not emailed -->" marker is cut — the working notes stay in the repo. The full
# file is still attached for anyone who wants the reasoning.
#
# ⚠️ This is the ONLY workflow allowed to watch Company_OS/briefs/**. A second one on the same path
# means two emails per commit. Add nothing here.

on:
  push:
    branches: [main]
    paths:
      - 'Company_OS/briefs/**'

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find the brief and render it
        id: brief
        run: |
          set -euo pipefail
          file=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'Company_OS/briefs/*.md' 2>/dev/null | tail -n1 || true)
          if [ -z "${file:-}" ] || [ ! -f "$file" ]; then
            file=$(ls -t Company_OS/briefs/*.md 2>/dev/null | head -n1 || true)
          fi
          if [ -z "${file:-}" ] || [ ! -f "$file" ]; then
            echo "No brief found; nothing to email."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # The renderer exits 2 on a stub commit. A placeholder brief must never be mailed —
          # the LinkedIn agent sent junk this way on 2026-07-13.
          if ! python3 .github/scripts/render_daily_brief_email.py "$file" > brief_body.html; then
            echo "Brief is a stub ($(wc -c < "$file") bytes) — not emailing."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # The agent marks a degraded run with a "> ⚠️ PARTIAL" banner. Surface that in the subject
          # so a brief with a dead connector can never be mistaken for a clean one.
          tag=""
          if grep -qi '^> *⚠\?.*PARTIAL' "$file"; then
            tag="[PARTIAL] "
            echo "Brief is marked PARTIAL — flagging the subject."
          fi

          echo "skip=false"                     >> "$GITHUB_OUTPUT"
          echo "path=$file"                     >> "$GITHUB_OUTPUT"
          echo "date=$(basename "$file" .md)"   >> "$GITHUB_OUTPUT"
          echo "tag=$tag"                       >> "$GITHUB_OUTPUT"

      - name: Send it
        if: steps.brief.outputs.skip == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: NG EarSafe Daily Report <${{ secrets.MAIL_USERNAME }}>
          to: meetshah@ngearsafe.com, riyashah@ngearsafe.com
          subject: "${{ steps.brief.outputs.tag }}Daily D2C Report — ${{ steps.brief.outputs.date }}"
          html_body: file://brief_body.html
          attachments: ${{ steps.brief.outputs.path }}
