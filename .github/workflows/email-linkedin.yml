name: Email the LinkedIn cycle brief

# Fires when the LinkedIn agent commits its cycle brief. Emails Meet ONLY the three post options —
# nothing about how the cycle was worked. The research, audit and rollups live below the
# "<!-- APPENDIX — not emailed -->" marker in the file and are cut here. (Meet, 2026-07-13:
# "I don't want to know how it ran, what it ran, just the 3 options.")
#
# The full brief is still attached, for when he wants the reasoning.

on:
  push:
    branches: [main]
    paths:
      - 'Company_OS/linkedin/**'

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build the email — options only, rendered as HTML
        id: pick
        run: |
          set -euo pipefail
          file=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'Company_OS/linkedin/*.md' 2>/dev/null | tail -n1 || true)
          if [ -z "${file:-}" ] || [ ! -f "$file" ]; then
            file=$(ls -t Company_OS/linkedin/*.md 2>/dev/null | head -n1 || true)
          fi
          if [ -z "${file:-}" ] || [ ! -f "$file" ]; then
            echo "No cycle brief found; nothing to email."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # A brief under ~400 bytes is a placeholder/stub commit, not a real brief. Don't mail junk.
          if [ "$(wc -c < "$file")" -lt 400 ]; then
            echo "Brief is a stub ($(wc -c < "$file") bytes) — not emailing."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          python3 .github/scripts/render_linkedin_email.py "$file" > linkedin_body.html
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "date=$(basename "$file" .md)" >> "$GITHUB_OUTPUT"

      - name: Send it
        if: steps.pick.outputs.skip == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: NG EarSafe LinkedIn <${{ secrets.MAIL_USERNAME }}>
          to: meetshah@ngearsafe.com
          subject: "LinkedIn — ${{ steps.pick.outputs.date }} — 3 options"
          html_body: file://linkedin_body.html
          attachments: ${{ steps.pick.outputs.path }}
