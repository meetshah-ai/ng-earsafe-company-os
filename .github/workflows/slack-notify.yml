name: Post reports to Slack

# When any department agent commits its report, post it to the matching Slack channel —
# a header, a readable excerpt, and a link to the full report on GitHub.
# One-way (agent -> Slack). Replying in a channel is handled by the relay service
# (Company_OS/platform/slack-relay/), not here.
# Uses the same commit-triggers-a-workflow pattern as the email workflows.
#
# Per-channel routing: each report path maps to its own channel via its own incoming
# webhook secret. A report type whose webhook secret is unset is skipped silently, so
# you can roll channels out one at a time.
#
#   Path                     Channel        Webhook secret (GitHub Actions)
#   Company_OS/briefs/       #daily-brief    SLACK_WEBHOOK_BRIEF
#   Company_OS/meta-ads/     #meta-ads       SLACK_WEBHOOK_META
#   Company_OS/google-ads/   #google-ads     SLACK_WEBHOOK_GOOGLE
#   Company_OS/linkedin/     #linkedin       SLACK_WEBHOOK_LINKEDIN
#   Company_OS/social/       #social         SLACK_WEBHOOK_CONTENT
#   Company_OS/seo-aeo/      #seo-aeo        SLACK_WEBHOOK_SEO
#   Company_OS/amazon-ads/   #amazon-ads     SLACK_WEBHOOK_AMAZONADS
#     (amazon-ads: no reports land here until the Amazon Ads Operator is deployed — see
#      Company_OS/agents/amazon-ads.agent.yaml header. Wired ahead of time; harmless until then.)

on:
  push:
    branches: [main]
    paths:
      - 'Company_OS/briefs/**'
      - 'Company_OS/meta-ads/**'
      - 'Company_OS/google-ads/**'
      - 'Company_OS/linkedin/**'
      - 'Company_OS/social/**'
      - 'Company_OS/seo-aeo/**'
      - 'Company_OS/amazon-ads/**'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Post the newest report to Slack
        env:
          SLACK_WEBHOOK_BRIEF: ${{ secrets.SLACK_WEBHOOK_BRIEF }}
          SLACK_WEBHOOK_META: ${{ secrets.SLACK_WEBHOOK_META }}
          SLACK_WEBHOOK_GOOGLE: ${{ secrets.SLACK_WEBHOOK_GOOGLE }}
          SLACK_WEBHOOK_LINKEDIN: ${{ secrets.SLACK_WEBHOOK_LINKEDIN }}
          SLACK_WEBHOOK_CONTENT: ${{ secrets.SLACK_WEBHOOK_CONTENT }}
          SLACK_WEBHOOK_SEO: ${{ secrets.SLACK_WEBHOOK_SEO }}
          SLACK_WEBHOOK_AMAZONADS: ${{ secrets.SLACK_WEBHOOK_AMAZONADS }}
        run: |
          set -euo pipefail
          file=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- \
            'Company_OS/briefs/*.md' 'Company_OS/meta-ads/*.md' 'Company_OS/google-ads/*.md' \
            'Company_OS/linkedin/*.md' 'Company_OS/social/*.md' 'Company_OS/seo-aeo/*.md' \
            'Company_OS/amazon-ads/*.md' 2>/dev/null | tail -n1 || true)
          if [ -z "${file:-}" ] || [ ! -f "$file" ]; then
            file=$(ls -t Company_OS/briefs/*.md Company_OS/meta-ads/*.md Company_OS/google-ads/*.md \
              Company_OS/linkedin/*.md Company_OS/social/*.md Company_OS/seo-aeo/*.md \
              Company_OS/amazon-ads/*.md 2>/dev/null | head -n1 || true)
          fi
          if [ -z "${file:-}" ] || [ ! -f "$file" ]; then
            echo "No report to post."; exit 0
          fi

          # Route each report type to its own channel (its own webhook).
          case "$file" in
            *briefs*)     title="📊 Daily Commercial Brief";    hook="$SLACK_WEBHOOK_BRIEF" ;;
            *meta-ads*)   title="📈 Meta Ads — Weekly Teardown"; hook="$SLACK_WEBHOOK_META" ;;
            *google-ads*) title="🔍 Google Ads — Operator";      hook="$SLACK_WEBHOOK_GOOGLE" ;;
            *linkedin*)   title="💼 LinkedIn — Content Cycle";    hook="$SLACK_WEBHOOK_LINKEDIN" ;;
            *social*)     title="📱 Daily Content Suggestions";  hook="$SLACK_WEBHOOK_CONTENT" ;;
            *seo-aeo*)    title="🔎 SEO/AEO — Weekly";           hook="$SLACK_WEBHOOK_SEO" ;;
            *amazon-ads*) title="📦 Amazon Ads — Operator";      hook="$SLACK_WEBHOOK_AMAZONADS" ;;
            *)            echo "Unknown report path; skipping."; exit 0 ;;
          esac
          if [ -z "${hook:-}" ]; then
            echo "No webhook configured for this report type yet; skipping."; exit 0
          fi
          date=$(basename "$file" .md)
          url="${{ github.server_url }}/${{ github.repository }}/blob/main/${file}"
          excerpt=$(head -c 2500 "$file")

          # jq builds the JSON so any characters in the excerpt are escaped safely.
          jq -n --arg t "$title · $date" --arg e "$excerpt" --arg u "$url" '{
            text: $t,
            blocks: [
              { type: "header",  text: { type: "plain_text", text: $t } },
              { type: "section", text: { type: "mrkdwn", text: $e } },
              { type: "section", text: { type: "mrkdwn", text: ("<" + $u + "|📎 Full report on GitHub>") } }
            ]
          }' | curl -sS -X POST -H 'Content-type: application/json' --data @- "$hook"
